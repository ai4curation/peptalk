id: https://w3id.org/ai4curation/peptalk/templates/common
name: peptalk_common
title: Building blocks for peptalk template answers
description: >-
  Classes, slots and enums that template answer schemas import (as `peptalk_common`). Every answer class
  derives from AnswerBase, which carries the optional payload keys a user can ask for (`--with`).
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  peptalk: https://w3id.org/ai4curation/peptalk/
default_prefix: peptalk
default_range: string
imports:
  - linkml:types

classes:
  AnswerBase:
    abstract: true
    description: The optional payload keys every answer may carry when asked for.
    attributes:
      confidence:
        description: Your probability, from 0 to 1, that your main answer is correct.
        range: float
        minimum_value: 0
        maximum_value: 1
      rationale:
        description: Two or three sentences on the features of the sequence that led to your answer.
      evidence:
        description: The residues your answer rests on.
        range: Evidence
        multivalued: true
        inlined_as_list: true
      alternatives:
        description: Answers you considered and rejected.
        range: Alternative
        multivalued: true
        inlined_as_list: true

  Evidence:
    attributes:
      position:
        description: 1-based residue position.
        range: integer
      residue:
        description: One-letter code.
      note:

  Alternative:
    attributes:
      answer:
      why_not:

  PfamDomain:
    attributes:
      accession:
        description: Pfam accession, PFxxxxx.
      name:
        description: Pfam short name.
      start:
        description: First residue (1-based).
        range: integer
      end:
        description: Last residue (1-based).
        range: integer

  CatalyticResidue:
    attributes:
      role:
      residue:
        description: One-letter code actually present in this sequence.
      position:
        description: 1-based residue position.
        range: integer

  SubstitutedResidue:
    attributes:
      role:
      expected:
        description: The canonical residue.
      found:
        description: The residue in this sequence.
      position:
        range: integer

  FunctionalResidue:
    attributes:
      position:
        range: integer
      residue:
        description: One-letter code.
      role:

  GoTerm:
    attributes:
      id:
        description: GO term id, GO:xxxxxxx.
      label:
        description: GO term name.

slots:
  transmembrane_helices:
    description: Transmembrane helices as [start, end] residue ranges (1-based).
    range: integer
    array:
      exact_number_dimensions: 2
      dimensions:
        - alias: helix
        - alias: bounds
          exact_cardinality: 2
  helices:
    description: Helices as [start, end] residue ranges (1-based).
    range: integer
    array:
      exact_number_dimensions: 2
      dimensions:
        - alias: helix
        - alias: bounds
          exact_cardinality: 2
  strands:
    description: Beta strands as [start, end] residue ranges (1-based).
    range: integer
    array:
      exact_number_dimensions: 2
      dimensions:
        - alias: strand
        - alias: bounds
          exact_cardinality: 2
  contacts:
    description: Residue pairs [i, j] predicted to be in contact.
    range: integer
    array:
      exact_number_dimensions: 2
      dimensions:
        - alias: contact
        - alias: pair
          exact_cardinality: 2

enums:
  YesNoUncertain:
    permissible_values:
      "yes":
      "no":
      uncertain:
