id: https://w3id.org/ai4curation/peptalk/templates/combined
name: peptalk_combined
title: Answer schema of the combined template
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  peptalk: https://w3id.org/ai4curation/peptalk/
default_prefix: peptalk
default_range: string
imports:
  - linkml:types
  - peptalk_common

classes:
  Answer:
    is_a: AnswerBase
    annotations:
      answer: true
    description: Domains, membrane features, catalytic residues, activity, fold and function in one answer.
    slots:
      - transmembrane_helices
    attributes:
      protein_name:
      function:
        description: One sentence on the molecular function.
      ec_number:
      enzyme_family:
      fold:
      pfam_domains:
        range: PfamDomain
        multivalued: true
        inlined_as_list: true
      signal_peptide:
        range: boolean
      catalytic_residues:
        range: CatalyticResidue
        multivalued: true
        inlined_as_list: true
      substituted_or_missing:
        range: SubstitutedResidue
        multivalued: true
        inlined_as_list: true
      catalytically_active:
        range: YesNoUncertain
      recognised:
        range: boolean
      reason:
