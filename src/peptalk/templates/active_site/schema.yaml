id: https://w3id.org/ai4curation/peptalk/templates/active-site
name: peptalk_active_site
title: Answer schema of the active-site template
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  peptalk: https://w3id.org/ai4curation/peptalk/
default_prefix: peptalk
default_range: string
imports:
  - linkml:types
  - peptalk_common

classes:
  Answer:
    is_a: AnswerBase
    annotations:
      answer: true
    description: Catalytic residues present or substituted, and whether the enzyme is likely active.
    attributes:
      protein_name:
      enzyme_family:
      catalytic_residues:
        range: CatalyticResidue
        multivalued: true
        inlined_as_list: true
      substituted_or_missing:
        description: Canonical catalytic or cofactor-binding residues this sequence lacks.
        range: SubstitutedResidue
        multivalued: true
        inlined_as_list: true
      catalytically_active:
        range: YesNoUncertain
      ec_number:
      reason:
        description: One or two sentences.
