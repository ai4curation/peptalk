id: https://w3id.org/ai4curation/peptalk/templates/structure
name: peptalk_structure
title: Answer schema of the structure template
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  peptalk: https://w3id.org/ai4curation/peptalk/
default_prefix: peptalk
default_range: string
imports:
  - linkml:types
  - peptalk_common

classes:
  Answer:
    is_a: AnswerBase
    annotations:
      answer: true
    description: Secondary structure, long-range contacts, fold, function and functional residues.
    slots:
      - helices
      - strands
      - contacts
    attributes:
      fold:
        description: Short name of the predicted fold or structural superfamily.
      protein_name:
      function:
        description: One sentence on the molecular function.
      functional_residues:
        range: FunctionalResidue
        multivalued: true
        inlined_as_list: true
      recognised:
        description: True if you recognise this as a specific known protein.
        range: boolean
