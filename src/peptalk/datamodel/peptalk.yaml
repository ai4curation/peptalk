id: https://w3id.org/ai4curation/peptalk
name: peptalk
title: peptalk interchange formats
description: >-
  The files peptalk reads and writes for exchange: claims files (claims about proteins, one question each) and
  annotation records (one model call with its answer, provenance, checks and cost; the rows of the SQLite store,
  of JSONL and Parquet exports, and of a future shared database). This schema is the single source of truth:
  peptalk/datamodel/peptalk.py (Pydantic) and the JSON Schemas next to it are generated from it with
  `just gen-schema`. Answer shapes of individual tasks are defined by their templates, not here.
license: MIT
version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  peptalk: https://w3id.org/ai4curation/peptalk/
default_prefix: peptalk
default_range: string
imports:
  - linkml:types

classes:

  # ---------------------------------------------------------------- claims files

  ClaimsFile:
    tree_root: true
    description: >-
      A claims file. Claims are grouped by protein (`proteins`) or listed flat (`claims`), or both.
      Write it in YAML; TSV and CSV with one row per claim are accepted for bulk input.
    attributes:
      proteins:
        description: Claims grouped by protein.
        range: ProteinClaims
        multivalued: true
        inlined_as_list: true
      claims:
        description: Claims listed one by one, each naming its protein.
        range: Claim
        multivalued: true
        inlined_as_list: true

  ProteinClaims:
    description: The claims about one protein.
    attributes:
      id:
        description: The protein, as the first word of its FASTA header.
        required: true
      claims:
        description: The claims about this protein.
        range: ClaimBody
        multivalued: true
        inlined_as_list: true
        required: true

  ClaimBody:
    description: One claim, without the protein it is about (as written under a protein).
    attributes:
      task:
        description: >-
          The ask template that puts the claim to the model, such as ask-catalytic-residue
          (`peptalk tasks --ask` lists them).
        required: true
      params:
        description: >-
          The template's parameters, all of them and no others, such as {position: 436, residue: D}.
          Values may be written as numbers; they are read as text.
        range: Any
      expected:
        description: >-
          The verdict you expect, for benchmarks. Never sent to the model and not part of the cache key.
        range: Verdict
      note:
        description: Any text. Kept with the result, never sent to the model.

  Claim:
    is_a: ClaimBody
    description: One claim about one protein.
    attributes:
      id:
        description: The protein, as the first word of its FASTA header.
        required: true

  # ---------------------------------------------------------------- annotation records

  Annotation:
    description: >-
      One answer to one task for one sequence, with provenance, checks and cost. A reused (cached) answer keeps
      the uid of the call that produced it, so merged exports deduplicate on uid.
    attributes:
      uid:
        identifier: true
        description: The call that produced the answer.
      id:
        description: The first word of the sequence's FASTA header, as given.
        required: true
      description:
        description: The rest of the FASTA header line.
      task:
        description: The template asked.
        required: true
      condition:
        description: The real sequence, or its shuffled copy (the control).
        range: Condition
        required: true
        ifabsent: string(real)
      sequence:
        description: The residues asked (for a shuffled control, the shuffled residues).
        required: true
      seq_md5:
        description: MD5 of the upper-case residues asked, the checksum UniParc uses. The key to the sequence.
        required: true
      sequence_length:
        range: integer
        required: true
      provider:
        description: anthropic, gemini, openai, or stub.
        required: true
      model:
        description: The model requested.
        required: true
      effort:
        description: The effort or thinking level, in the provider's own labels.
        required: true
      options:
        description: Every request field besides the prompt, as sent.
        range: Any
      client:
        description: The client library and its version.
      annotator_version:
        description: The peptalk version that made the call.
      served_model:
        description: The model that answered, as the provider reports it.
      fallback_used:
        description: True if a server-side fallback model answered instead of the one requested.
        range: boolean
        required: true
        ifabsent: false
      response_id:
        description: The provider's id for the response.
      prompt_version:
        description: First 12 hex digits of the SHA-256 of the template's prompt file.
        required: true
      prompt_sha256:
        description: SHA-256 of the full prompt sent.
        required: true
      context:
        description: How much of the FASTA header the model saw.
        range: HeaderContext
        required: true
        ifabsent: string(blind)
      output:
        description: Free text parsed for JSON (the default), or provider structured output.
        range: OutputMode
        required: true
        ifabsent: string(text)
      params:
        description: The template's parameters (ask templates).
        range: Any
      payload:
        description: Optional answer keys asked for (confidence, rationale, evidence, alternatives).
        multivalued: true
      expected:
        description: The verdict a claim expected. Never sent to the model.
        range: Verdict
      note:
        description: The claim's note. Never sent to the model.
      header:
        description: Every field parsed from the FASTA header (accession, organism, taxon id, ...).
        range: Any
      text:
        description: The model's reply, verbatim.
      answer:
        description: >-
          The answer object parsed from the reply: open-ended, shaped by the template (its JSON Schema is
          `peptalk tasks --schema TASK`).
        range: Any
      validation_error:
        description: Why the answer object failed the template's answer model, if it did.
      stop_reason:
        description: Why the model stopped, as the provider reports it; `refusal:<category>` for a refusal.
      error:
        description: Why the call failed, if it did.
      usage:
        description: Token counts.
        range: Usage
        inlined: true
      expected_input_tokens:
        description: The provider's count of the request alone; checked against the reported input.
        range: integer
      cost_usd:
        description: Cost in US dollars at list price, if the model has a price.
        range: float
      batch:
        description: True if asked through a provider batch API.
        range: boolean
        required: true
        ifabsent: false
      batch_id:
        description: The provider's batch id.
      cached:
        description: True if this answer was reused from the store instead of asked again.
        range: boolean
        required: true
        ifabsent: false
      checks:
        description: The automatic checks of the answer.
        range: Check
        multivalued: true
        inlined_as_list: true
      confidence:
        description: >-
          peptalk's own result from its checks (not the model's stated confidence, which is in the answer).
        range: Confidence
        required: true
        ifabsent: string(no_answer)
      started_at:
        description: When the call started (ISO 8601, UTC).
        required: true
      finished_at:
        description: When the call finished (ISO 8601, UTC).
      duration_ms:
        range: integer

  Usage:
    description: Token counts for one call. thinking_tokens is a part of output_tokens when reported.
    attributes:
      input_tokens:
        range: integer
        required: true
        ifabsent: int(0)
      output_tokens:
        range: integer
        required: true
        ifabsent: int(0)
      thinking_tokens:
        range: integer
      cache_read_input_tokens:
        range: integer
        required: true
        ifabsent: int(0)
      cache_creation_input_tokens:
        range: integer
        required: true
        ifabsent: int(0)

  Check:
    description: One automatic check of an answer against the sequence, the claim or the shuffled control.
    attributes:
      name:
        required: true
      passed:
        range: boolean
        required: true
      detail:
        description: What failed, if anything.
        required: true
        ifabsent: string("")

  Any:
    description: Any value (an open-ended object).
    class_uri: linkml:Any

enums:
  Verdict:
    permissible_values:
      "yes":
      "no":
      uncertain:
  Condition:
    permissible_values:
      real:
        description: The sequence as given.
      shuffled:
        description: A shuffled copy of it, the control.
  HeaderContext:
    permissible_values:
      blind:
        description: The model saw '>sequence' only (the fs2f protocol).
      organism:
        description: The model saw the organism and taxon id from the header.
      full:
        description: The model saw the whole header line.
  OutputMode:
    permissible_values:
      text:
        description: JSON asked for in plain text, then parsed.
      json_schema:
        description: Provider structured output constrained to the template's JSON Schema.
  Confidence:
    permissible_values:
      checks_passed:
        description: Every check passed (which says nothing more).
      flagged:
        description: At least one check failed.
      no_answer:
        description: The call failed, was refused, or gave no valid answer object.
